apiVersion: apps/v1
kind: Deployment
metadata:
  name: modresorts
  namespace: modresorts
  labels:
    app: modresorts
    version: v2.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modresorts
  template:
    metadata:
      labels:
        app: modresorts
        version: v2.0.0
    spec:
      containers:
      - name: modresorts
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        # Server Configuration
        - name: SERVER_PORT
          value: "8080"
        - name: SERVER_NAME
          value: "modresorts-server"
        - name: SERVER_FULL_NAME
          value: "modresorts-server-gke"
        
        # Spring Configuration
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        
        # Redis Configuration (GCP Memorystore)
        - name: REDIS_HOST
          value: "{{REDIS_HOST}}"
        - name: REDIS_PORT
          value: "{{REDIS_PORT}}"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: modresorts-secrets
              key: redis-password
              optional: true
        - name: REDIS_TIMEOUT
          value: "2000"
        
        # Database Configuration
        - name: DB_URL
          value: "{{DB_URL}}"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: modresorts-secrets
              key: db-username
              optional: true
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: modresorts-secrets
              key: db-password
              optional: true
        - name: DB_DRIVER
          value: "{{DB_DRIVER}}"
        
        # Naming Service Configuration
        - name: NAMING_FACTORY_INITIAL
          value: "{{NAMING_FACTORY_INITIAL}}"
        - name: NAMING_PROVIDER_URL
          value: "{{NAMING_PROVIDER_URL}}"
        
        # Weather API Configuration
        - name: WEATHER_API_KEY
          valueFrom:
            secretKeyRef:
              name: modresorts-secrets
              key: weather-api-key
              optional: true
        
        # JVM Options
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
        
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
