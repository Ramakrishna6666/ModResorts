version: '3.8'

services:
  modresorts-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: modresorts:latest
    container_name: modresorts-app
    ports:
      - "8080:8080"
    environment:
      # JVM Configuration
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      # Application Configuration
      - TZ=UTC
      - LANG=en_US.UTF-8
      # External Service Connections (configure as needed)
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-modresorts}
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      # Application logs
      - ./logs:/usr/local/tomcat/logs
      # Configuration files (if needed)
      - ./config:/usr/local/tomcat/conf/custom
    networks:
      - modresorts-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  modresorts-network:
    driver: bridge

volumes:
  logs:
  config:
