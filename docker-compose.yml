version: '3.8'

services:
  # PostgreSQL 16 Database Service
  postgres:
    image: postgres:16-alpine
    container_name: modresorts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: modresorts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/postgresql:/docker-entrypoint-initdb.d
    networks:
      - modresorts-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modresorts"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # pgAdmin 4 - PostgreSQL Administration Tool (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: modresorts-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@modresorts.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - modresorts-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  modresorts-network:
    driver: bridge
