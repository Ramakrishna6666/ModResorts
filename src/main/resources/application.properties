# ModResorts Cloud-Native Configuration for Azure
# All sensitive values should be externalized to Azure Key Vault or environment variables

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Application Info
spring.application.name=modresorts
info.app.name=ModResorts
info.app.version=2.0.0

# Azure Storage Configuration
# Use Managed Identity for authentication in production
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:modresorts-data}
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}

# Azure Key Vault Configuration
# Use Managed Identity for authentication in production
azure.keyvault.uri=${AZURE_KEYVAULT_URI:}

# Azure Service Bus Configuration
# Use Managed Identity for authentication in production
azure.servicebus.namespace=${AZURE_SERVICEBUS_NAMESPACE:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:scheduled-tasks}
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}

# Database Configuration (HikariCP connection pool)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Logging Configuration (JSON format for cloud monitoring)
logging.level.root=INFO
logging.level.com.acme.modres=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Actuator Endpoints for Health Checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# Timezone Configuration (UTC for cloud consistency)
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
