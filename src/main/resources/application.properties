# PostgreSQL Database Configuration
# Update these values based on your PostgreSQL server setup

# Database Connection
db.postgresql.url=jdbc:postgresql://localhost:5432/modresorts
db.postgresql.username=postgres
db.postgresql.password=postgres
db.postgresql.driver=org.postgresql.Driver

# Connection Pool Settings (HikariCP)
db.pool.maximum-pool-size=10
db.pool.minimum-idle=2
db.pool.connection-timeout=30000
db.pool.idle-timeout=600000
db.pool.max-lifetime=1800000

# PostgreSQL Specific Settings
db.postgresql.schema=public
db.postgresql.ssl=false
db.postgresql.ssl-mode=prefer

# Application Settings
app.name=ModResorts
app.version=2.0.0
