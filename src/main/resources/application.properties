# Spring Boot Application Configuration for Cloud Deployment

# Server Configuration
server.port=${PORT:8080}

# Application Name
spring.application.name=modresorts

# AWS Configuration
aws.region=${AWS_REGION:us-east-1}
s3.bucket.name=${S3_BUCKET_NAME:modresorts-data}

# Redis Configuration for Session Management (Amazon ElastiCache)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.namespace=modresorts:session

# Database Configuration (Amazon RDS with HikariCP)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/modresorts}
spring.datasource.username=${DATABASE_USERNAME:modresorts}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration (JSON format for cloud monitoring)
logging.level.root=INFO
logging.level.com.acme.modres=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator for Health Checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
