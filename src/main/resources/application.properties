# ModResorts Application Configuration
# PostgreSQL Database Migration Settings

# Application Information
app.name=ModResorts
app.version=2.0.0
app.description=Modern Resort Management Application

# Database Configuration
# PostgreSQL connection settings (migrated from SQL Server)
database.type=postgresql
database.host=localhost
database.port=5432
database.name=modresorts
database.schema=public

# JNDI DataSource Lookup (for Jakarta EE containers)
# Uncomment the @Resource annotation in ModResortsCustomerInformation.java
# to use container-managed datasource
datasource.jndi.name=jdbc/ModResortsJndi

# Logging Configuration
logging.level=INFO
logging.database.enabled=true

# Migration Information
migration.source.database=SQL Server 2017
migration.target.database=PostgreSQL 16
migration.date=2025-01-15
migration.status=completed

# Feature Flags
feature.database.connection.test=true
feature.customer.info.enabled=true

# Performance Settings
performance.connection.pool.enabled=true
performance.query.timeout=30
performance.connection.timeout=10

# Environment
environment=development
# Change to 'production' for production deployment
