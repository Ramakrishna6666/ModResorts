# Spring Boot Application Configuration for ModResorts
# Cloud-native configuration using environment variables

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# AWS Configuration
aws.region=${AWS_REGION:us-east-1}
s3.bucket.name=${S3_BUCKET_NAME:modresorts-data}
use.s3.storage=${USE_S3_STORAGE:false}

# AWS Secrets Manager
weather.api.secret.name=${WEATHER_API_SECRET_NAME:modresorts/weather-api-key}

# Database Configuration (HikariCP)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/modresorts}
spring.datasource.username=${DATABASE_USERNAME:modresorts}
spring.datasource.password=${DATABASE_PASSWORD:changeme}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.postgresql.Driver}

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Logging Configuration
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.acme.modres=${APP_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Application Info
spring.application.name=ModResorts
management.endpoints.web.exposure.include=health,info,metrics
