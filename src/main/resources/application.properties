# Spring Boot Application Configuration
spring.application.name=modresorts

# Actuator Health Check Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# Server Configuration
server.port=${SERVER_PORT:8080}

# Redis Configuration for Distributed Cache (Memorystore)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=${REDIS_TIMEOUT:2000}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Naming Service Configuration (replaces JNDI/RMI)
naming.factory.initial=${NAMING_FACTORY_INITIAL:}
naming.provider.url=${NAMING_PROVIDER_URL:}

# Server Identity Configuration (replaces WebSphere ServerName)
server.name=${SERVER_NAME:modresorts-server}
server.full.name=${SERVER_FULL_NAME:modresorts-server-instance-1}

# Weather API Configuration
weather.api.key=${WEATHER_API_KEY:}
