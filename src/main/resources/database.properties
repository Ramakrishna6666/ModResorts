# PostgreSQL Database Configuration
# Update these values according to your PostgreSQL instance

# PostgreSQL JDBC Connection Properties
db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://localhost:5432/modresorts
db.username=postgres
db.password=postgres

# Connection Pool Settings
db.pool.initialSize=5
db.pool.maxTotal=20
db.pool.maxIdle=10
db.pool.minIdle=5
db.pool.maxWaitMillis=10000

# PostgreSQL-specific settings
db.postgresql.ssl=false
db.postgresql.sslmode=prefer
db.postgresql.connectTimeout=10
db.postgresql.socketTimeout=30
db.postgresql.tcpKeepAlive=true

# Schema settings (PostgreSQL default schema is 'public')
db.schema=public

# Application settings
db.validation.query=SELECT 1
db.test.on.borrow=true
db.test.while.idle=true
db.time.between.eviction.runs.millis=60000
