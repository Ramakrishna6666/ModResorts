# PostgreSQL Database Configuration
# This file contains database connection properties for PostgreSQL 16

# Database Connection Properties
db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://localhost:5432/modresorts
db.username=modresorts_user
db.password=changeme

# Connection Pool Settings (HikariCP)
db.pool.maximumPoolSize=10
db.pool.minimumIdle=5
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000

# PostgreSQL Specific Settings
db.postgresql.schema=public
db.postgresql.ssl=false
db.postgresql.sslmode=prefer

# Application Settings
db.application.name=ModResorts
db.connection.autoCommit=false
db.connection.readOnly=false

# Query Timeout (in seconds)
db.query.timeout=30

# Logging
db.logging.enabled=true
db.logging.level=INFO
