# PostgreSQL Database Configuration
# Connection String Format: jdbc:postgresql://host:port/database

# Database Connection Properties
db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://localhost:5432/modresorts
db.username=postgres
db.password=postgres

# Connection Pool Settings (HikariCP)
db.pool.maximumPoolSize=10
db.pool.minimumIdle=5
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000

# PostgreSQL-specific settings
db.pool.dataSource.cachePrepStmts=true
db.pool.dataSource.prepStmtCacheSize=250
db.pool.dataSource.prepStmtCacheSqlLimit=2048
db.pool.dataSource.useServerPrepStmts=true

# Schema Configuration
db.schema=public
