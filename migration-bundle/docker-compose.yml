version: '3.8'

services:
  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: modresorts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: modresorts
      POSTGRES_USER: modresorts_user
      POSTGRES_PASSWORD: modresorts_pass
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migration-bundle/postgresql_migration.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - modresorts-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modresorts_user -d modresorts"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_duration=on"

  # pgAdmin 4 - PostgreSQL Administration Tool
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: modresorts-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@modresorts.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - modresorts-network
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL Backup Service (optional)
  postgres-backup:
    image: postgres:16-alpine
    container_name: modresorts-backup
    restart: "no"
    environment:
      POSTGRES_DB: modresorts
      POSTGRES_USER: modresorts_user
      POSTGRES_PASSWORD: modresorts_pass
      PGHOST: postgres
    volumes:
      - ./backups:/backups
    networks:
      - modresorts-network
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: |
      sh -c '
        echo "Starting backup at $$(date)"
        pg_dump -U modresorts_user -d modresorts -F c -f /backups/modresorts_$$(date +%Y%m%d_%H%M%S).backup
        echo "Backup completed at $$(date)"
      '

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  modresorts-network:
    driver: bridge
